<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculadora Simples 🧮</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Calculadora 🌟</h1>
    <div class="inputs">
      <label for="num1">Número 1</label>
      <input type="number" id="num1" placeholder="Ex.: 10" />
      <label for="num2">Número 2</label>
      <input type="number" id="num2" placeholder="Ex.: 5" />
    </div>

    <div class="buttons">
      <button id="btnSomar">Somar</button>
      <button id="btnSubtrair">Diminuir</button>
      <button id="btnMultiplicar">Multiplicar</button>
      <button id="btnDividir">Dividir</button>
    </div>

    <div class="resultado">
      <h2>Resultado: <span id="resultado">--</span></h2>
    </div>
  </div>

  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
